name: OIDC Debug

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  show-claims:
    runs-on: ubuntu-latest
    steps:
      - name: Print OIDC token claims
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | python3 -c "import sys,json;print(json.load(sys.stdin)['value'])")
          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2)
          python3 - "$PAYLOAD" << 'PYEOF'
          import sys, base64, json
          p = sys.argv[1]
          p += '=' * (-len(p) % 4)
          claims = json.loads(base64.urlsafe_b64decode(p))
          for k in ["iss","sub","aud","exp","repository","repository_owner","repository_id","repository_owner_id","ref","event_name","workflow","actor"]:
              if k in claims:
                  print(k + ": " + str(claims[k]))
          PYEOF
